name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restaurar pacotes
        run: dotnet restore "ProjetoFaculdade6Semestre/ProjetoFaculdade6Semestre.sln"
      - name: Compilar
        run: dotnet build "ProjetoFaculdade6Semestre/ProjetoFaculdade6Semestre.sln" --no-restore --configuration Release
